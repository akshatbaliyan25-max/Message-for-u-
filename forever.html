<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forever</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, Helvetica, Arial, sans-serif;
    background: radial-gradient(ellipse at top, #1b2340 0%, #0d1226 55%, #05070f 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24"><text y="18" font-size="18">✨</text></svg>') 13 13, auto;
  }

  .star {
    position: fixed;
    background: #fff;
    border-radius: 50%;
    opacity: 0.4;
    animation: twinkle ease-in-out infinite;
    pointer-events: none;
    z-index: 1;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 1; }
  }

  .moon {
    position: fixed;
    top: 6%;
    right: 10%;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fffdf5, #f2ecd0 60%, #e4dcb8 100%);
    box-shadow: 0 0 50px 14px rgba(255, 250, 220, 0.35);
    z-index: 2;
  }

  .cloud {
    position: fixed;
    top: 4%;
    width: 220px;
    height: 60px;
    background: rgba(255,255,255,0.10);
    border-radius: 100px;
    filter: blur(6px);
    animation: driftCloud linear infinite;
    z-index: 2;
    pointer-events: none;
  }

  .cloud::before, .cloud::after {
    content: "";
    position: absolute;
    background: rgba(255,255,255,0.10);
    border-radius: 50%;
  }

  .cloud::before { width: 90px; height: 90px; top: -35px; left: 20px; }
  .cloud::after { width: 70px; height: 70px; top: -25px; right: 25px; }

  .cloud2 { top: 10%; opacity: 0.7; }
  .cloud3 { top: 2%; opacity: 0.5; }

  @keyframes driftCloud {
    0% { transform: translateX(-30vw); }
    100% { transform: translateX(130vw); }
  }

  /* Constellation heart */
  .constellation {
    width: 220px;
    height: 200px;
    margin-bottom: 22px;
    opacity: 0;
    animation: fadeIn 1.5s ease forwards;
    animation-delay: 0.3s;
    z-index: 10;
  }

  .constellation path {
    fill: none;
    stroke: #d8d0ff;
    stroke-width: 1.8;
    stroke-linejoin: round;
    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;
    animation: drawHeart 2.8s ease forwards;
    animation-delay: 0.6s;
    filter: drop-shadow(0 0 6px rgba(216,208,255,0.7));
  }

  .constellation .pt {
    fill: #fff;
    opacity: 0;
    filter: drop-shadow(0 0 5px rgba(255,255,255,0.95));
    animation: starPop 0.5s ease forwards;
    transform-box: fill-box;
    transform-origin: center;
  }

  @keyframes starPop {
    0%   { opacity: 0; transform: scale(0); }
    60%  { opacity: 1; transform: scale(1.5); }
    100% { opacity: 1; transform: scale(1); }
  }

  @keyframes drawHeart {
    to { stroke-dashoffset: 0; }
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  .quote-text {
    font-size: 20px;
    color: #e8e4ff;
    font-style: italic;
    text-align: center;
    max-width: 380px;
    line-height: 1.65;
    padding: 0 20px;
    z-index: 10;
    opacity: 0;
    animation: fadeInUp 1.4s ease forwards;
    animation-delay: 3.6s;
  }

  .final-text {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #f2f3fb;
    text-shadow: 0 4px 30px rgba(150,170,255,0.5);
    text-align: center;
    z-index: 10;
    opacity: 0;
    animation: fadeInUp 1.4s ease forwards;
    animation-delay: 5.0s;
    margin-top: 20px;
  }

  @keyframes fadeInUp {
    0% { opacity: 0; transform: translateY(20px); }
    100% { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

  <div class="moon"></div>
  <div class="cloud" style="animation-duration: 70s;"></div>
  <div class="cloud cloud2" style="animation-duration: 95s; animation-delay: -30s;"></div>
  <div class="cloud cloud3" style="animation-duration: 110s; animation-delay: -60s;"></div>

  <svg class="constellation" width="220" height="200" viewBox="0 0 220 200" xmlns="http://www.w3.org/2000/svg">
    <path d="M110,60 L115.4,43.7 L143.9,20.4 L185.7,27.9 L206,66 L185.7,109.7 L143.9,147.6 L115.4,178.7 L110,192 L104.6,178.7 L76.1,147.6 L34.3,109.7 L14,66 L34.3,27.9 L66.1,20.4 L104.6,43.7 Z" />
    <circle class="pt" cx="110"   cy="60"   r="3"   style="animation-delay:0.60s" />
    <circle class="pt" cx="115.4" cy="43.7" r="3"   style="animation-delay:0.79s" />
    <circle class="pt" cx="143.9" cy="20.4" r="3"   style="animation-delay:0.97s" />
    <circle class="pt" cx="185.7" cy="27.9" r="3"   style="animation-delay:1.16s" />
    <circle class="pt" cx="206"   cy="66"   r="3"   style="animation-delay:1.35s" />
    <circle class="pt" cx="185.7" cy="109.7" r="3"  style="animation-delay:1.53s" />
    <circle class="pt" cx="143.9" cy="147.6" r="3"  style="animation-delay:1.72s" />
    <circle class="pt" cx="115.4" cy="178.7" r="3"  style="animation-delay:1.91s" />
    <circle class="pt" cx="110"   cy="192"   r="3.5" style="animation-delay:2.09s" />
    <circle class="pt" cx="104.6" cy="178.7" r="3"  style="animation-delay:2.28s" />
    <circle class="pt" cx="76.1"  cy="147.6" r="3"  style="animation-delay:2.47s" />
    <circle class="pt" cx="34.3"  cy="109.7" r="3"  style="animation-delay:2.65s" />
    <circle class="pt" cx="14"    cy="66"    r="3"  style="animation-delay:2.84s" />
    <circle class="pt" cx="34.3"  cy="27.9"  r="3"  style="animation-delay:3.03s" />
    <circle class="pt" cx="66.1"  cy="20.4"  r="3"  style="animation-delay:3.21s" />
    <circle class="pt" cx="104.6" cy="43.7"  r="3"  style="animation-delay:3.40s" />
  </svg>

  <div class="quote-text">"If I could give you anything, it would be my eyes — so you could see, through them, just how beautiful you truly are."</div>

  <div class="final-text">LOVE U FOREVER</div>

<script>
  function generateStars() {
    const count = 100;
    for (let i = 0; i < count; i++) {
      const s = document.createElement("div");
      s.classList.add("star");
      const size = 1 + Math.random() * 2;
      s.style.width = size + "px";
      s.style.height = size + "px";
      s.style.left = Math.random() * 100 + "vw";
      s.style.top = Math.random() * 100 + "vh";
      s.style.animationDuration = (2 + Math.random() * 4) + "s";
      s.style.animationDelay = (Math.random() * 4) + "s";
      document.body.appendChild(s);
    }
  }
  generateStars();
</script>

</body>
</html>
