  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24"><text y="20" font-size="20">🌹</text></svg>') 15 15, auto;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  }
