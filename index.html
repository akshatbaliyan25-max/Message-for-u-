<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For You</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, Helvetica, Arial, sans-serif;
    background: radial-gradient(ellipse at top, #1b2340 0%, #0d1226 55%, #05070f 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24"><text y="18" font-size="18">✨</text></svg>') 13 13, auto;
  }

  button {
    cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24"><text y="18" font-size="18">✨</text></svg>') 13 13, pointer;
  }

  /* Twinkling stars scattered across the whole sky */
  .star {
    position: fixed;
    background: #fff;
    border-radius: 50%;
    opacity: 0.4;
    animation: twinkle ease-in-out infinite;
    pointer-events: none;
    z-index: 1;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 1; }
  }

  /* Moon, fixed near the top */
  .moon {
    position: fixed;
    top: 6%;
    right: 10%;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fffdf5, #f2ecd0 60%, #e4dcb8 100%);
    box-shadow: 0 0 50px 14px rgba(255, 250, 220, 0.35);
    z-index: 2;
  }

  /* Clouds confined to the top band only */
  .cloud {
    position: fixed;
    top: 4%;
    width: 220px;
    height: 60px;
    background: rgba(255,255,255,0.10);
    border-radius: 100px;
    filter: blur(6px);
    animation: driftCloud linear infinite;
    z-index: 2;
    pointer-events: none;
  }

  .cloud::before, .cloud::after {
    content: "";
    position: absolute;
    background: rgba(255,255,255,0.10);
    border-radius: 50%;
  }

  .cloud::before { width: 90px; height: 90px; top: -35px; left: 20px; }
  .cloud::after { width: 70px; height: 70px; top: -25px; right: 25px; }

  .cloud2 { top: 10%; opacity: 0.7; }
  .cloud3 { top: 2%; opacity: 0.5; }

  @keyframes driftCloud {
    0% { transform: translateX(-30vw); }
    100% { transform: translateX(130vw); }
  }

  /* Shooting stars flying across (message reveal moments) */
  .shootingstar {
    position: fixed;
    top: var(--y, 50%);
    left: -60px;
    font-size: 22px;
    opacity: 0.95;
    animation: flyAcross linear forwards;
    pointer-events: none;
    z-index: 50;
  }

  @keyframes flyAcross {
    0%   { transform: translateX(0) translateY(0); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateX(115vw) translateY(-40px); opacity: 0; }
  }

  .wishstar {
    position: fixed;
    top: var(--y, 50%);
    left: -60px;
    font-size: 20px;
    opacity: 0.95;
    animation: flyAcross linear forwards;
    pointer-events: none;
    z-index: 50;
  }

  /* Sparkle confetti for reveal moments */
  .confetti {
    position: fixed;
    top: -40px;
    font-size: 15px;
    color: #d8d0ff;
    font-style: italic;
    opacity: 0.9;
    animation: confettiFall linear forwards;
    pointer-events: none;
    z-index: 40;
  }

  @keyframes confettiFall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 1; }
    100% { transform: translateY(105vh) rotate(280deg); opacity: 0; }
  }

  .card {
    background: rgba(20, 26, 50, 0.55);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    padding: 55px 45px;
    max-width: 460px;
    width: 90%;
    min-height: 240px;
    text-align: center;
    box-shadow: 0 25px 70px rgba(0,0,0,0.5), 0 0 40px rgba(150,170,255,0.08);
    z-index: 10;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .screen { display: none; width: 100%; flex-direction: column; align-items: center; }
  .screen.active { display: flex; }

  .question {
    font-size: 23px;
    color: #f2f3fb;
    margin-bottom: 30px;
    font-weight: 600;
    line-height: 1.5;
    letter-spacing: 0.2px;
  }

  .reveal-text {
    font-size: 21px;
    color: #c9d3ff;
    font-style: italic;
    margin-top: 20px;
    opacity: 0;
    animation: fadeInUp 0.8s ease forwards;
  }

  @keyframes fadeInUp {
    0% { opacity: 0; transform: translateY(12px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .buttons { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }

  button {
    border: 1px solid rgba(255,255,255,0.3);
    padding: 12px 28px;
    font-size: 15px;
    border-radius: 8px;
    font-weight: 600;
    font-family: inherit;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    background: rgba(255,255,255,0.08);
    color: #f2f3fb;
  }

  .no-btn {
    background: transparent;
    border-color: rgba(255,255,255,0.15);
    color: #9aa3c9;
  }

  button:hover {
    transform: translateY(-2px);
    background: rgba(255,255,255,0.16);
    box-shadow: 0 8px 20px rgba(150,170,255,0.2);
  }

  .subtext {
    margin-top: 18px;
    font-size: 13px;
    color: #8790b8;
    font-style: italic;
  }

  #soundToggle {
    position: fixed;
    top: 18px;
    right: 18px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    color: #f2f3fb;
    font-size: 16px;
    padding: 0;
    z-index: 60;
  }

  #easterEgg {
    position: fixed;
    bottom: 16px;
    left: 16px;
    font-size: 14px;
    opacity: 0.3;
    z-index: 60;
    background: none;
    border: none;
    padding: 6px;
    color: #c9d3ff;
  }

  #easterEgg:hover { opacity: 0.8; }

  #easterMsg {
    position: fixed;
    bottom: 40px;
    left: 16px;
    background: rgba(20, 26, 50, 0.9);
    border: 1px solid rgba(255,255,255,0.15);
    color: #f2f3fb;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-style: italic;
    max-width: 220px;
    opacity: 0;
    transition: opacity 0.4s ease;
    z-index: 60;
    pointer-events: none;
  }

  #easterMsg.show { opacity: 1; }
</style>
</head>
<body id="bodyEl">

  <div class="moon"></div>
  <div class="cloud" style="animation-duration: 70s;"></div>
  <div class="cloud cloud2" style="animation-duration: 95s; animation-delay: -30s;"></div>
  <div class="cloud cloud3" style="animation-duration: 110s; animation-delay: -60s;"></div>

  <button id="soundToggle" onclick="toggleSound()">🔇</button>
  <button id="easterEgg" onclick="showEasterEgg()">✦</button>
  <div id="easterMsg">You found me 🥰 I love you extra today.</div>

  <div class="card" id="cardEl">

    <div class="screen active" id="screenAsk">
      <div class="question">I have a message for you 💌</div>
      <div class="buttons">
        <button onclick="playFlockThenReveal()">Yes</button>
        <button class="no-btn" onclick="goTo('screenPleaseYes')">No</button>
      </div>
    </div>

    <div class="screen" id="screenPleaseYes">
      <div class="question">But please, see the message 🥺</div>
      <div class="buttons">
        <button onclick="playFlockThenReveal()">Yes</button>
      </div>
    </div>

    <div class="screen" id="screenMsg1">
      <div class="question">You know, there's a problem in my hand.</div>
      <div class="buttons" id="problemBtnWrap">
        <button onclick="revealProblem()">What's the problem?</button>
      </div>
      <div class="reveal-text" id="problemReveal" style="display:none;">It's not holding yours.</div>
      <div class="buttons" id="nextMsgWrap" style="display:none; margin-top: 24px;">
        <button onclick="playWishStarsThenReveal()">See another message</button>
      </div>
    </div>

    <div class="screen" id="screenColor">
      <div class="question">What's my favorite color?</div>
      <div class="buttons" id="colorBtnWrap">
        <button onclick="revealColor()">Tell me</button>
      </div>
      <div class="reveal-text" id="colorReveal" style="display:none;">The color of your eyes 💙</div>
      <div class="buttons" id="continueWrap" style="display:none; margin-top: 24px;">
        <button onclick="goTo('screenHeart')">Continue</button>
      </div>
    </div>

    <div class="screen" id="screenHeart">
      <div class="question">Do you have a heart? 🤍</div>
      <div class="buttons" id="heartBtnWrap">
        <button onclick="revealHeart(true)">Yes</button>
        <button class="no-btn" onclick="revealHeart(false)">No</button>
      </div>
      <div class="reveal-text" id="heartReveal" style="display:none;"></div>
      <div class="buttons" id="queenWrap" style="display:none; margin-top: 24px;">
        <button onclick="goToNext()">Press if u r Queen 👑</button>
      </div>
    </div>

  </div>

<script>
  let soundEnabled = false;
  let audioCtx = null;

  function goTo(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  }

  function goToNext() {
    window.location.href = "forever.html";
  }

  function toggleSound() {
    soundEnabled = !soundEnabled;
    document.getElementById("soundToggle").textContent = soundEnabled ? "🔊" : "🔇";
    if (soundEnabled && !audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  function playChime() {
    if (!soundEnabled || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = 660;
    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
  }

  document.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("mouseenter", playChime);
  });

  function showEasterEgg() {
    const msg = document.getElementById("easterMsg");
    msg.classList.add("show");
    setTimeout(() => msg.classList.remove("show"), 3000);
  }

  function playFlockThenReveal() {
    spawnFlock("shootingstar", "🌠", () => goTo("screenMsg1"));
  }

  function playWishStarsThenReveal() {
    spawnFlock("wishstar", "⭐", () => goTo("screenColor"));
  }

  function spawnFlock(className, emoji, onDone) {
    const count = 7;
    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        const el = document.createElement("div");
        el.classList.add(className);
        el.textContent = emoji;
        el.style.setProperty("--y", (10 + Math.random() * 70) + "vh");
        el.style.animationDuration = (2 + Math.random() * 1.2) + "s";
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 3500);
      }, i * 180);
    }
    setTimeout(onDone, 1600);
  }

  function revealProblem() {
    document.getElementById("problemBtnWrap").style.display = "none";
    document.getElementById("problemReveal").style.display = "block";
    document.getElementById("nextMsgWrap").style.display = "flex";
    spawnConfetti();
  }

  function revealColor() {
    document.getElementById("colorBtnWrap").style.display = "none";
    document.getElementById("colorReveal").style.display = "block";
    document.getElementById("continueWrap").style.display = "flex";
    spawnConfetti();
  }

  function revealHeart(hasHeart) {
    document.getElementById("heartBtnWrap").style.display = "none";
    const reveal = document.getElementById("heartReveal");
    reveal.textContent = hasHeart
      ? "Then why are you stealing mine? 💘"
      : "Is that why you're stealing mine? 😏";
    reveal.style.display = "block";
    document.getElementById("queenWrap").style.display = "flex";
    spawnConfetti();
  }

  function spawnConfetti() {
    const items = ["✦", "always", "✦", "yours", "✦", "forever", "✦"];
    for (let i = 0; i < 24; i++) {
      setTimeout(() => {
        const c = document.createElement("div");
        c.classList.add("confetti");
        c.textContent = items[Math.floor(Math.random() * items.length)];
        c.style.left = Math.random() * 100 + "vw";
        c.style.fontSize = (13 + Math.random() * 10) + "px";
        c.style.animationDuration = (3 + Math.random() * 2.5) + "s";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 6000);
      }, i * 60);
    }
  }

  // Generate a fixed field of twinkling stars once on load
  function generateStars() {
    const count = 90;
    for (let i = 0; i < count; i++) {
      const s = document.createElement("div");
      s.classList.add("star");
      const size = 1 + Math.random() * 2;
      s.style.width = size + "px";
      s.style.height = size + "px";
      s.style.left = Math.random() * 100 + "vw";
      s.style.top = Math.random() * 100 + "vh";
      s.style.animationDuration = (2 + Math.random() * 4) + "s";
      s.style.animationDelay = (Math.random() * 4) + "s";
      document.body.appendChild(s);
    }
  }
  generateStars();
</script>

</body>
</html>
